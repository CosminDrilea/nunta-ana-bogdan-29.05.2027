services:
  - type: web
    name: invitatie-ana-bogdan
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: RSVP_CLIENT_ID
        value: fam-vornicu
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false
